name: Update rainfall lookup

on:
  schedule:
    - cron: "0 1 10 * *" # 09:00 HKT on the 10th — skip unless HKO Last-Modified/ETag changed
    - cron: "0 1 * * 1" # 09:00 HKT Monday — same fingerprint skip
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only print source Last-Modified; do not rebuild D1"
        type: boolean
        default: false
      force:
        description: "Fetch even if the source fingerprint is unchanged"
        type: boolean
        default: false
      full_rewrite:
        description: "Wipe and rewrite every D1 lookup row (recovery only)"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r hk_rainfall_pipeline/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: hk_rainfall_pipeline/data/source_fingerprint.json
          key: source-fingerprint-${{ github.run_id }}
          restore-keys: |
            source-fingerprint-
      - name: Decide whether to rebuild
        id: decide
        working-directory: hk_rainfall_pipeline
        env:
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
          FORCE: ${{ github.event.inputs.force }}
          FULL_REWRITE: ${{ github.event.inputs.full_rewrite }}
        run: |
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          echo "full_rewrite=false" >> "$GITHUB_OUTPUT"
          if [ "$FULL_REWRITE" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "full_rewrite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CHECK_ONLY" = "true" ]; then
            python3 update_rainfall.py --check-only || true
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 update_rainfall.py --check-only
          code=$?
          set -e
          if [ "$code" -eq 10 ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.rebuild == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hk_rainfall_pipeline/cloudflare/package-lock.json
      - name: Install Worker deps
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        run: npm ci
      - name: Fetch HKO and rebuild lookup
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline
        run: python3 update_rainfall.py
      - name: Python tests
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline
        run: python -m unittest discover tests
      - name: Worker tests
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        run: npm test
      - name: Build D1 seed
        id: seed
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FULL_REWRITE: ${{ steps.decide.outputs.full_rewrite }}
        run: |
          if [ "$FULL_REWRITE" = "true" ]; then
            python3 build_seed.py --full
          else
            python3 build_seed.py --from-remote
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          stats = json.loads(Path("seed_stats.json").read_text(encoding="utf-8"))
          apply = "false" if stats.get("noop") else "true"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"apply={apply}\n")
              fh.write(f"upserts={stats.get('upserts', 0)}\n")
              fh.write(f"deletes={stats.get('deletes', 0)}\n")
          print(
              f"seed mode={stats['mode']} upserts={stats['upserts']} "
              f"deletes={stats['deletes']} noop={stats['noop']}"
          )
          PY
      - name: Load remote D1
        if: steps.decide.outputs.rebuild == 'true' && steps.seed.outputs.apply == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FULL_REWRITE: ${{ steps.decide.outputs.full_rewrite }}
        run: |
          if [ "$FULL_REWRITE" = "true" ]; then
            npx wrangler d1 execute hk-rainy-day --remote --file=schema.sql --yes
          fi
          npx wrangler d1 execute hk-rainy-day --remote --file=seed.sql --yes
      - uses: actions/cache/save@v4
        if: steps.decide.outputs.rebuild == 'true'
        with:
          path: hk_rainfall_pipeline/data/source_fingerprint.json
          key: source-fingerprint-${{ github.run_id }}
