name: Update rainfall lookup

on:
  schedule:
    - cron: "0 1 10 * *" # 09:00 HKT on the 10th — monthly rebuild
    - cron: "0 1 * * 1" # 09:00 HKT Monday — rebuild if Last-Modified/ETag changed
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only print source Last-Modified; do not rebuild D1"
        type: boolean
        default: false
      force:
        description: "Rebuild even if the source fingerprint is unchanged"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r hk_rainfall_pipeline/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: hk_rainfall_pipeline/data/source_fingerprint.json
          key: source-fingerprint-${{ github.run_id }}
          restore-keys: |
            source-fingerprint-
      - name: Decide whether to rebuild
        id: decide
        working-directory: hk_rainfall_pipeline
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CHECK_ONLY" = "true" ]; then
            python3 update_rainfall.py --check-only || true
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "0 1 10 * *" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 update_rainfall.py --check-only
          code=$?
          set -e
          if [ "$code" -eq 10 ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.rebuild == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hk_rainfall_pipeline/cloudflare/package-lock.json
      - name: Install Worker deps
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        run: npm ci
      - name: Fetch HKO and rebuild lookup
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline
        run: python3 update_rainfall.py
      - name: Python tests
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline
        run: python -m unittest discover tests
      - name: Worker tests
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        run: npm test
      - name: Build D1 seed
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        run: python3 build_seed.py
      - name: Load remote D1
        if: steps.decide.outputs.rebuild == 'true'
        working-directory: hk_rainfall_pipeline/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute hk-rainy-day --remote --file=schema.sql --yes
          npx wrangler d1 execute hk-rainy-day --remote --file=seed.sql --yes
      - uses: actions/cache/save@v4
        if: steps.decide.outputs.rebuild == 'true'
        with:
          path: hk_rainfall_pipeline/data/source_fingerprint.json
          key: source-fingerprint-${{ github.run_id }}
