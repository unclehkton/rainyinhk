name: Update rainfall lookup

on:
  schedule:
    - cron: "0 1 10 * *" # 09:00 HKT on the 10th — monthly rebuild
    - cron: "0 1 * * 1" # 09:00 HKT Monday — Last-Modified check
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only print source Last-Modified; do not rebuild D1"
        type: boolean
        default: false

jobs:
  check:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1'
      || (github.event_name == 'workflow_dispatch' && inputs.check_only == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r hk_rainfall_pipeline/requirements.txt
      - name: Last-Modified check
        working-directory: hk_rainfall_pipeline
        run: python3 update_rainfall.py --check-only

  rebuild:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 1 10 * *'
      || (github.event_name == 'workflow_dispatch' && inputs.check_only != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r hk_rainfall_pipeline/requirements.txt
      - name: Fetch HKO and rebuild lookup
        working-directory: hk_rainfall_pipeline
        run: python3 update_rainfall.py
      - name: Build D1 seed
        working-directory: hk_rainfall_pipeline/cloudflare
        run: python3 build_seed.py
      - name: Load remote D1
        working-directory: hk_rainfall_pipeline/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute hk-rainy-day --remote --file=schema.sql --yes
          npx wrangler d1 execute hk-rainy-day --remote --file=seed.sql --yes
